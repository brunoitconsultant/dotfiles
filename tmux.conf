bind s split-window -h -p 20

# Allow programs (like Vim/Neovim) to rename the tmux window title
set -g allow-rename on
set -g set-titles on
set -g set-titles-string "#T"

# Display the window title (#W) in the status bar
set -g window-status-format "#I:#{?#{!=:#T,#{host}},#T,#W}#F"
set -g window-status-current-format "#I:#{?#{!=:#T,#{host}},#T,#W}#F"

